trigger:
  branches:
    include: [main, dev]

pr:
  branches:
    include: ['*']

stages:
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: build
        strategy:
          matrix:
            Ubuntu2404_Release:
              imageName: ubuntu-24.04
              buildType: Release
              preset: conan-release
            Windows2022_Release:
              imageName: windows-2022
              buildType: Release
              preset: conan-release
            # macOS: disabled, uncomment to re-enable
            #macOS15_Release:
            #  imageName: macOS-15
            #  buildType: Release
            #  preset: conan-release
        pool:
          vmImage: $(imageName)
        steps:
          - script: |
              sudo apt-get update
              sudo apt-get install -y libgl-dev libx11-dev libxext-dev \
                libwayland-dev libxkbcommon-dev libdbus-1-dev \
                libcairo2-dev libfontconfig1-dev pkg-config
            condition: eq(variables['Agent.OS'], 'Linux')
            displayName: Install system dependencies (Linux)

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - script: pip install conan
            displayName: Install Conan

          - script: conan profile detect
            displayName: Detect Conan profile

          - script: conan install . -s build_type=$(buildType) --build=missing
            displayName: Conan install

          - script: cmake --preset $(preset)
            displayName: Configure

          - script: cmake --build build/$(buildType)
            displayName: Build

          - script: ctest --test-dir build/$(buildType) -C $(buildType) --output-on-failure
            displayName: Test

  - stage: Package
    displayName: Package
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: package_linux
        displayName: DEB + RPM (Ubuntu 24.04)
        pool:
          vmImage: ubuntu-24.04
        steps:
          - script: |
              sudo apt-get update
              sudo apt-get install -y cmake python3-pip dpkg-dev rpm \
                libgl-dev libx11-dev libxext-dev \
                libwayland-dev libxkbcommon-dev libdbus-1-dev \
                libcairo2-dev libfontconfig1-dev pkg-config
            displayName: Install system dependencies

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - script: pip install conan
            displayName: Install Conan

          - script: conan profile detect
            displayName: Detect Conan profile

          - script: conan install . -s build_type=Release --build=missing
            displayName: Conan install

          - script: cmake --preset conan-release
            displayName: Configure

          - script: cmake --build build/Release
            displayName: Build

          - script: cd build/Release && cpack -C Release
            displayName: Package

          - task: CopyFiles@2
            inputs:
              SourceFolder: build/Release
              Contents: |
                *.deb
                *.rpm
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: SVision3Demo-linux

      - job: package_appimage
        displayName: AppImage (Ubuntu 24.04)
        pool:
          vmImage: ubuntu-24.04
        steps:
          - script: |
              sudo apt-get update
              sudo apt-get install -y cmake python3-pip wget libfuse2 \
                libgl-dev libx11-dev libxext-dev \
                libwayland-dev libxkbcommon-dev libdbus-1-dev \
                libcairo2-dev libfontconfig1-dev pkg-config
            displayName: Install system dependencies

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - script: pip install conan
            displayName: Install Conan

          - script: conan profile detect
            displayName: Detect Conan profile

          - script: conan install . -s build_type=Release --build=missing
            displayName: Conan install

          - script: cmake --preset conan-release
            displayName: Configure

          - script: cmake --build build/Release
            displayName: Build

          - script: cmake --install build/Release --prefix AppDir/usr
            displayName: Install into AppDir

          - script: |
              wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
              chmod +x linuxdeploy-x86_64.AppImage
            displayName: Download linuxdeploy

          # Desktop file + icon come from packaging/ (committed, also used
          # by the deb/rpm install rules in CMakeLists.txt).
          - script: >
              ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run
              --appdir AppDir
              -d packaging/SVision3Demo.desktop
              -i packaging/svision3demo.png
              --output appimage
            displayName: Build AppImage

          - task: CopyFiles@2
            inputs:
              Contents: '*.AppImage'
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: SVision3Demo-appimage

      - job: package_msi
        displayName: MSI (Windows 2022)
        pool:
          vmImage: windows-2022
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - script: pip install conan
            displayName: Install Conan

          - script: conan profile detect
            displayName: Detect Conan profile

          - script: conan install . -s build_type=Release --build=missing
            displayName: Conan install

          - script: cmake --preset conan-release
            displayName: Configure

          - script: cmake --build build/Release --config Release
            displayName: Build

          - script: cd build/Release && cpack -C Release
            displayName: Package MSI

          - task: CopyFiles@2
            inputs:
              SourceFolder: build/Release
              Contents: '*.msi'
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: SVision3Demo-windows

