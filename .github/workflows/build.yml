name: Build

on:
  push:
    branches: [main, dev, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: ubuntu-24.04 / Release
    runs-on: ubuntu-24.04

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libx11-dev libxext-dev \
            libwayland-dev libwayland-bin wayland-protocols libegl1-mesa-dev libxkbcommon-dev libdbus-1-dev \
            libcairo2-dev libfontconfig1-dev libharfbuzz-dev libfreetype-dev libssl-dev zlib1g-dev pkg-config

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-Linux-Release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Linux-Release-

      - name: Detect Conan profile
        run: conan profile detect

      - name: Conan install
        run: conan install . -s build_type=Release -s "tomlplusplus/*:compiler.cppstd=20" -s "lunasvg/*:compiler.cppstd=20" --build=missing

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # FETCHCONTENT_UPDATES_DISCONNECTED=ON stops FetchContent from
      # re-checking svision3's git remote on every reconfigure (e.g. the
      # cmake_check_build_system pass that runs on every `cmake --build`,
      # including cpack's preinstall step in the packaging jobs downstream).
      # Without it, that recheck needs `.git` to still be a valid repo --
      # fragile once the tree round-trips through an artifact upload/download.
      - name: Configure
        run: cmake --preset conan-release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build/Release

      - name: Test
        run: ctest --test-dir build/Release -C Release --output-on-failure

      # actions/cache is capped at 10GB per repo (shared across every cache
      # key we have: Linux/Windows x sccache's own GHA cache), with LRU
      # eviction once that's exceeded. ~/.conan2/p holds source and build
      # scratch dirs for every dependency, not just the final package
      # binaries we actually need to skip a rebuild -- trimming that before
      # the cache saves (which happens automatically as a post-step at job
      # end) keeps our footprint down so it's less likely to get evicted.
      - name: Trim Conan cache before saving
        shell: bash
        run: conan cache clean "*" --source --build --download

      # Reused by package-linux / package-linux-appimage below so they don't
      # have to reconfigure+recompile the same Release build.
      # include-hidden-files: actions/upload-artifact excludes dotfiles by
      # default, which silently drops _deps/svision3-src/.git -- that's what
      # actually caused "fatal: not a git repository" downstream. Keeping
      # this alongside UPDATES_DISCONNECTED above as belt-and-suspenders,
      # in case something ever still needs a working .git in that tree.
      - name: Upload build directory (Release)
        uses: actions/upload-artifact@v7
        with:
          name: build-ubuntu-24.04-Release
          path: build/Release
          include-hidden-files: true
          retention-days: 1

  build-windows:
    name: windows-2022 / Release
    runs-on: windows-2022

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install conan ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-Windows-Release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Windows-Release-

      - name: Detect Conan profile
        run: conan profile detect

      # Ninja instead of conan's default Visual Studio generator, so
      # CMAKE_<LANG>_COMPILER_LAUNCHER=sccache below actually takes effect
      # (the VS generator ignores it). Needs the MSVC dev environment above
      # for cl.exe/link.exe to be on PATH.
      - name: Conan install
        run: conan install . -s build_type=Release -s "tomlplusplus/*:compiler.cppstd=20" -s "lunasvg/*:compiler.cppstd=20" -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded switches MSVC from /Zi
      # (shared external .pdb, written by multiple concurrent cl.exe) to /Z7
      # (debug info embedded per-object). sccache breaks the serialization
      # that normally makes concurrent /Zi writes to one .pdb safe, causing
      # "cannot open program database ... use /FS" even though /FS is
      # already passed -- /Z7 sidesteps the shared-file contention entirely.
      # FETCHCONTENT_UPDATES_DISCONNECTED=ON stops FetchContent from
      # re-checking svision3's git remote on every reconfigure (e.g. the
      # cmake_check_build_system pass that runs on every `cmake --build`,
      # including cpack's preinstall step in package-msi downstream).
      - name: Configure
        run: cmake --preset conan-release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build/Release

      - name: Test
        run: ctest --test-dir build/Release -C Release --output-on-failure

      # See "Trim Conan cache before saving" comment in build-linux -- same
      # 10GB-repo-cap/eviction concern applies here.
      - name: Trim Conan cache before saving
        shell: bash
        run: conan cache clean "*" --source --build --download

      # Reused by package-msi below so it doesn't have to reconfigure+recompile
      # the same Release build.
      # include-hidden-files: actions/upload-artifact excludes dotfiles by
      # default, which silently drops _deps/svision3-src/.git -- that's what
      # caused "fatal: not a git repository" downstream on Linux. Keeping
      # this alongside UPDATES_DISCONNECTED above as belt-and-suspenders.
      - name: Upload build directory (Release)
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-2022-Release
          path: build/Release
          include-hidden-files: true
          retention-days: 1

  package-linux:
    name: Package DEB + RPM (Linux)
    needs: build-linux
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Determine package suffix
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      # Same full list build-linux installs, plus dpkg-dev/rpm for packaging.
      # If cmake_check_build_system (below) decides to reconfigure, svision3's
      # CMakeLists.txt re-runs its pkg_check_modules() calls (cairo, harfbuzz,
      # freetype, wayland, etc.) same as it did during the original configure
      # -- this job needs every system package that configure needed, not
      # just the packaging tools.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm libgl-dev libx11-dev libxext-dev \
            libwayland-dev libwayland-bin wayland-protocols libegl1-mesa-dev libxkbcommon-dev libdbus-1-dev \
            libcairo2-dev libfontconfig1-dev libharfbuzz-dev libfreetype-dev libssl-dev zlib1g-dev pkg-config

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install conan

      # Restoring the same cache build-linux populated so this install is a
      # fast cache hit, not a real rebuild.
      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-Linux-Release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Linux-Release-

      - name: Detect Conan profile
        run: conan profile detect

      # cmake_check_build_system (below) reconfigures on every `cmake --build`
      # invocation, including cpack's preinstall pass -- when it does,
      # svision3's CMakeLists.txt re-runs find_package(spdlog) etc. against
      # whatever's actually resolvable right now. Relying on a *restored*
      # cache to already exactly match what build-linux's own conan install
      # produced turned out not to be reliable (some restored packages were
      # missing specific library files, e.g. Catch2Main, for reasons that
      # didn't reproduce locally) -- running the exact same `conan install`
      # here guarantees a fully consistent, correctly resolved environment
      # instead of hoping a partial cache restore lines up.
      - name: Conan install
        run: conan install . -s build_type=Release -s "tomlplusplus/*:compiler.cppstd=20" -s "lunasvg/*:compiler.cppstd=20" --build=missing

      - name: Download build directory (Release)
        uses: actions/download-artifact@v7
        with:
          name: build-ubuntu-24.04-Release
          path: build/Release

      # cmake_check_build_system runs on every `cmake --build`/preinstall
      # invocation and reconfigures from scratch if it thinks anything looks
      # newer than the generated build system -- easy to trigger spuriously
      # after an artifact download, since extraction doesn't preserve the
      # original relative ordering of source-vs-build-output timestamps.
      # Normalizing everything to one fixed mtime makes every "is X newer
      # than Y" check false, so no reconfigure gets triggered at all.
      # IMPORTANT: this must also cover ~/.conan2 (restored by the "Cache
      # Conan packages" step above) -- it's outside the repo checkout, so a
      # plain `find .` misses it, leaving those files at "now" and strictly
      # newer than everything else we just normalized. That mismatch is what
      # was actually triggering the reconfigure this whole time.
      - name: Normalize timestamps
        shell: bash
        run: |
          find . -exec touch -t 202001010000 {} + 2>/dev/null || true
          find ~/.conan2 -exec touch -t 202001010000 {} + 2>/dev/null || true

      # cpack's DEB/RPM generators run a "preinstall" build pass first to make
      # sure everything's up to date. If a reconfigure does get triggered
      # anyway, it recompiles using the sccache launcher already baked into
      # the Makefiles from build-linux's configure -- so sccache needs to be
      # present here too, even though this job doesn't configure/build
      # anything itself. Runs after build-linux, so this is a cache hit
      # rather than a real rebuild.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Package DEB and RPM
        run: cd build/Release && cpack -C Release

      - name: Show CPack logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s globstar nullglob
          for f in build/Release/_CPack_Packages/**/*.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload CPack logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cpack-logs-linux-deb
          path: build/Release/_CPack_Packages/**/*.log
          if-no-files-found: ignore

      - name: Rename packages
        shell: bash
        run: |
          cd build/Release
          for f in *.deb; do mv -- "$f" "SVision3Demo${{ steps.version.outputs.suffix }}.deb"; done
          for f in *.rpm; do mv -- "$f" "SVision3Demo${{ steps.version.outputs.suffix }}.rpm"; done

      - uses: actions/upload-artifact@v7
        with:
          name: SVision3Demo${{ steps.version.outputs.suffix }}(deb)
          path: build/Release/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: SVision3Demo${{ steps.version.outputs.suffix }}(rpm)
          path: build/Release/*.rpm

  package-linux-appimage:
    name: Package AppImage (Linux)
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Determine package suffix
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 \
            libgl-dev libx11-dev libxext-dev \
            libwayland-dev libegl1-mesa-dev libxkbcommon-dev libdbus-1-dev \
            libcairo2-dev libfontconfig1-dev libharfbuzz-dev libfreetype-dev libssl-dev zlib1g-dev pkg-config \
            libfuse2

      - name: Download build directory (Release)
        uses: actions/download-artifact@v7
        with:
          name: build-ubuntu-24.04-Release
          path: build/Release

      # Unlike cpack (see package-linux), cmake --install only runs the
      # install script against already-built files -- it doesn't re-invoke
      # the build system, so no sccache dependency here.
      - name: Install into AppDir
        run: cmake --install build/Release --prefix AppDir/usr

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create .desktop file and icon
        run: |
          cat > SVision3Demo.desktop <<'EOF'
          [Desktop Entry]
          Name=SVision3Demo
          Exec=SVision3Demo
          Icon=svision3demo
          Type=Application
          Categories=Utility;
          EOF
          python3 -c "
          import struct, zlib
          w,h=64,64
          raw=b''.join(b'\x00'+bytes([0,120,212]*w) for _ in range(h))
          def mk(t,d):
              c=struct.pack('>I',len(d))+t+d
              return c+struct.pack('>I',zlib.crc32(c[4:])&0xffffffff)
          data=(b'\x89PNG\r\n\x1a\n'
              +mk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))
              +mk(b'IDAT',zlib.compress(raw))
              +mk(b'IEND',b''))
          open('svision3demo.png','wb').write(data)
          "

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -d SVision3Demo.desktop \
            -i svision3demo.png \
            --output appimage

      - name: Rename AppImage
        shell: bash
        run: |
          for f in *.AppImage; do
            [ "$f" = "linuxdeploy-x86_64.AppImage" ] && continue
            mv -- "$f" "SVision3Demo${{ steps.version.outputs.suffix }}.AppImage"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: SVision3Demo${{ steps.version.outputs.suffix }}-appimage
          path: |
            *.AppImage
            !linuxdeploy-x86_64.AppImage

  package-msi:
    name: Package MSI (Windows)
    needs: build-windows
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Determine package suffix
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan and Ninja
        run: pip install conan ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      # Restoring the same cache build-windows populated so this install is a
      # fast cache hit, not a real rebuild.
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-Windows-Release-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Windows-Release-

      - name: Detect Conan profile
        run: conan profile detect

      # See the matching comment in package-linux: relying on a *restored*
      # cache to already exactly match build-windows's own conan install
      # wasn't reliable if cmake_check_build_system (below) decides to
      # reconfigure during cpack's preinstall pass. Running the exact same
      # `conan install` here guarantees a fully consistent environment.
      - name: Conan install
        run: conan install . -s build_type=Release -s "tomlplusplus/*:compiler.cppstd=20" -s "lunasvg/*:compiler.cppstd=20" -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing

      - name: Download build directory (Release)
        uses: actions/download-artifact@v7
        with:
          name: build-windows-2022-Release
          path: build/Release

      # See "Normalize timestamps" comment in package-linux -- stops
      # cmake_check_build_system from spuriously deciding to reconfigure.
      # Must also cover ~/.conan2 (restored above), not just the checkout.
      - name: Normalize timestamps
        shell: bash
        run: |
          find . -exec touch -t 202001010000 {} + 2>/dev/null || true
          find ~/.conan2 -exec touch -t 202001010000 {} + 2>/dev/null || true

      # cpack's preinstall build pass (see comment in package-linux) needs
      # cl.exe, ninja, and sccache all present -- none of which this job
      # otherwise sets up, since it never configures/builds itself.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Package MSI
        run: cd build/Release && cpack -C Release

      - name: Show CPack logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s globstar nullglob
          for f in build/Release/_CPack_Packages/**/*.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload CPack logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cpack-logs-windows
          path: build/Release/_CPack_Packages/**/*.log
          if-no-files-found: ignore

      - name: Rename package
        shell: bash
        run: |
          cd build/Release
          for f in *.msi; do mv -- "$f" "SVision3Demo${{ steps.version.outputs.suffix }}.msi"; done

      - uses: actions/upload-artifact@v7
        with:
          name: SVision3Demo${{ steps.version.outputs.suffix }}-windows
          path: build/Release/*.msi

