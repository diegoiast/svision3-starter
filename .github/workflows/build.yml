name: Build

on:
  push:
    branches: [main, dev, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: ubuntu-latest / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            preset: conan-debug
          - build_type: Release
            preset: conan-release

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libx11-dev libxext-dev \
            libwayland-dev libwayland-bin wayland-protocols libegl1-mesa-dev libxkbcommon-dev libdbus-1-dev \
            libcairo2-dev libfontconfig1-dev libharfbuzz-dev libfreetype-dev libssl-dev zlib1g-dev pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-Linux-${{ matrix.build_type }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Linux-${{ matrix.build_type }}-
            conan-Linux-

      - name: Detect Conan profile
        run: conan profile detect

      - name: Conan install
        run: conan install . -s build_type=${{ matrix.build_type }} -s "tomlplusplus/*:compiler.cppstd=20" -s "lunasvg/*:compiler.cppstd=20" --build=missing

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build/${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.build_type }} -C ${{ matrix.build_type }} --output-on-failure

      # Reused by package-linux / package-linux-appimage below so they don't
      # have to reconfigure+recompile the same Release build.
      - name: Upload build directory (Release)
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-ubuntu-latest-Release
          path: build/Release
          retention-days: 1

  build-windows:
    name: windows-latest / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            preset: conan-debug
          - build_type: Release
            preset: conan-release

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install conan ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-Windows-${{ matrix.build_type }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Windows-${{ matrix.build_type }}-
            conan-Windows-

      - name: Detect Conan profile
        run: conan profile detect

      # Ninja instead of conan's default Visual Studio generator, so
      # CMAKE_<LANG>_COMPILER_LAUNCHER=sccache below actually takes effect
      # (the VS generator ignores it). Needs the MSVC dev environment above
      # for cl.exe/link.exe to be on PATH.
      - name: Conan install
        run: conan install . -s build_type=${{ matrix.build_type }} -s "tomlplusplus/*:compiler.cppstd=20" -s "lunasvg/*:compiler.cppstd=20" -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded switches MSVC from /Zi
      # (shared external .pdb, written by multiple concurrent cl.exe) to /Z7
      # (debug info embedded per-object). sccache breaks the serialization
      # that normally makes concurrent /Zi writes to one .pdb safe, causing
      # "cannot open program database ... use /FS" even though /FS is
      # already passed -- /Z7 sidesteps the shared-file contention entirely.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build build/${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.build_type }} -C ${{ matrix.build_type }} --output-on-failure

      # Reused by package-msi below so it doesn't have to reconfigure+recompile
      # the same Release build.
      - name: Upload build directory (Release)
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-latest-Release
          path: build/Release
          retention-days: 1

  package-linux:
    name: Package DEB + RPM (Linux)
    needs: build-linux
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Determine package suffix
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm

      - name: Download build directory (Release)
        uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-latest-Release
          path: build/Release

      # cpack's DEB/RPM generators run a "preinstall" build pass first to make
      # sure everything's up to date. If the downloaded tree looks stale (easy
      # after an artifact re-extract) it recompiles using the sccache launcher
      # already baked into the Makefiles from build-linux's configure -- so
      # sccache needs to be present here too, even though this job doesn't
      # configure/build anything itself. Runs after build-linux, so this is a
      # cache hit rather than a real rebuild.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Package DEB and RPM
        run: cd build/Release && cpack -C Release

      - name: Show CPack logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s globstar nullglob
          for f in build/Release/_CPack_Packages/**/*.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload CPack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpack-logs-linux-deb
          path: build/Release/_CPack_Packages/**/*.log
          if-no-files-found: ignore

      - name: Rename packages
        shell: bash
        run: |
          cd build/Release
          for f in *.deb; do mv -- "$f" "SVision3Demo${{ steps.version.outputs.suffix }}.deb"; done
          for f in *.rpm; do mv -- "$f" "SVision3Demo${{ steps.version.outputs.suffix }}.rpm"; done

      - uses: actions/upload-artifact@v4
        with:
          name: SVision3Demo-linux
          path: |
            build/Release/*.deb
            build/Release/*.rpm

  package-linux-appimage:
    name: Package AppImage (Linux)
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine package suffix
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 \
            libgl-dev libx11-dev libxext-dev \
            libwayland-dev libegl1-mesa-dev libxkbcommon-dev libdbus-1-dev \
            libcairo2-dev libfontconfig1-dev libharfbuzz-dev libfreetype-dev libssl-dev zlib1g-dev pkg-config \
            libfuse2

      - name: Download build directory (Release)
        uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-latest-Release
          path: build/Release

      # Unlike cpack (see package-linux), cmake --install only runs the
      # install script against already-built files -- it doesn't re-invoke
      # the build system, so no sccache dependency here.
      - name: Install into AppDir
        run: cmake --install build/Release --prefix AppDir/usr

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create .desktop file and icon
        run: |
          cat > SVision3Demo.desktop <<'EOF'
          [Desktop Entry]
          Name=SVision3Demo
          Exec=demo
          Icon=svision3demo
          Type=Application
          Categories=Utility;
          EOF
          python3 -c "
          import struct, zlib
          w,h=64,64
          raw=b''.join(b'\x00'+bytes([0,120,212]*w) for _ in range(h))
          def mk(t,d):
              c=struct.pack('>I',len(d))+t+d
              return c+struct.pack('>I',zlib.crc32(c[4:])&0xffffffff)
          data=(b'\x89PNG\r\n\x1a\n'
              +mk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))
              +mk(b'IDAT',zlib.compress(raw))
              +mk(b'IEND',b''))
          open('svision3demo.png','wb').write(data)
          "

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -d SVision3Demo.desktop \
            -i svision3demo.png \
            --output appimage

      - name: Rename AppImage
        shell: bash
        run: |
          for f in *.AppImage; do
            [ "$f" = "linuxdeploy-x86_64.AppImage" ] && continue
            mv -- "$f" "SVision3Demo${{ steps.version.outputs.suffix }}.AppImage"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SVision3Demo-appimage
          path: |
            *.AppImage
            !linuxdeploy-x86_64.AppImage

  package-msi:
    name: Package MSI (Windows)
    needs: build-windows
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Determine package suffix
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: pip install ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download build directory (Release)
        uses: actions/download-artifact@v4
        with:
          name: build-windows-latest-Release
          path: build/Release

      # cpack's preinstall build pass (see comment in package-linux) needs
      # cl.exe, ninja, and sccache all present -- none of which this job
      # otherwise sets up, since it never configures/builds itself.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Package MSI
        run: cd build/Release && cpack -C Release

      - name: Show CPack logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s globstar nullglob
          for f in build/Release/_CPack_Packages/**/*.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload CPack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpack-logs-windows
          path: build/Release/_CPack_Packages/**/*.log
          if-no-files-found: ignore

      - name: Rename package
        shell: bash
        run: |
          cd build/Release
          for f in *.msi; do mv -- "$f" "SVision3Demo${{ steps.version.outputs.suffix }}.msi"; done

      - uses: actions/upload-artifact@v4
        with:
          name: SVision3Demo-windows
          path: build/Release/*.msi

