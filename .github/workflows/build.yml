name: Build

on:
  push:
    branches: [main, dev, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: ubuntu-latest / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            preset: conan-debug
          - build_type: Release
            preset: conan-release

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libx11-dev libxext-dev \
            libwayland-dev libxkbcommon-dev libdbus-1-dev \
            libcairo2-dev libfontconfig1-dev libharfbuzz-dev libfreetype-dev libssl-dev zlib1g-dev pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-Linux-${{ matrix.build_type }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Linux-${{ matrix.build_type }}-
            conan-Linux-

      - name: Detect Conan profile
        run: conan profile detect

      - name: Conan install
        run: conan install . -s build_type=${{ matrix.build_type }} -s "tomlplusplus/*:compiler.cppstd=20" -s "lunasvg/*:compiler.cppstd=20" --build=missing

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build/${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.build_type }} -C ${{ matrix.build_type }} --output-on-failure

      # Reused by package-linux / package-linux-appimage below so they don't
      # have to reconfigure+recompile the same Release build.
      - name: Upload build directory (Release)
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-ubuntu-latest-Release
          path: build/Release
          retention-days: 1

  build-windows:
    name: windows-latest / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            preset: conan-debug
          - build_type: Release
            preset: conan-release

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install conan ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-Windows-${{ matrix.build_type }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Windows-${{ matrix.build_type }}-
            conan-Windows-

      - name: Detect Conan profile
        run: conan profile detect

      # Ninja instead of conan's default Visual Studio generator, so
      # CMAKE_<LANG>_COMPILER_LAUNCHER=sccache below actually takes effect
      # (the VS generator ignores it). Needs the MSVC dev environment above
      # for cl.exe/link.exe to be on PATH.
      - name: Conan install
        run: conan install . -s build_type=${{ matrix.build_type }} -s "tomlplusplus/*:compiler.cppstd=20" -s "lunasvg/*:compiler.cppstd=20" -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build/${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.build_type }} -C ${{ matrix.build_type }} --output-on-failure

      # Reused by package-msi below so it doesn't have to reconfigure+recompile
      # the same Release build.
      - name: Upload build directory (Release)
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-latest-Release
          path: build/Release
          retention-days: 1

  package-linux:
    name: Package DEB + RPM (Linux)
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm

      - name: Download build directory (Release)
        uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-latest-Release
          path: build/Release

      - name: Package DEB and RPM
        run: cd build/Release && cpack -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: SVision3Demo-linux
          path: |
            build/Release/*.deb
            build/Release/*.rpm

  package-linux-appimage:
    name: Package AppImage (Linux)
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 \
            libgl-dev libx11-dev libxext-dev \
            libwayland-dev libxkbcommon-dev libdbus-1-dev \
            libcairo2-dev libfontconfig1-dev libharfbuzz-dev libfreetype-dev libssl-dev zlib1g-dev pkg-config \
            libfuse2

      - name: Download build directory (Release)
        uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-latest-Release
          path: build/Release

      - name: Install into AppDir
        run: cmake --install build/Release --prefix AppDir/usr

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create .desktop file and icon
        run: |
          cat > SVision3Demo.desktop <<'EOF'
          [Desktop Entry]
          Name=SVision3Demo
          Exec=demo
          Icon=svision3demo
          Type=Application
          Categories=Utility;
          EOF
          python3 -c "
          import struct, zlib
          w,h=64,64
          raw=b''.join(b'\x00'+bytes([0,120,212]*w) for _ in range(h))
          def mk(t,d):
              c=struct.pack('>I',len(d))+t+d
              return c+struct.pack('>I',zlib.crc32(c[4:])&0xffffffff)
          data=(b'\x89PNG\r\n\x1a\n'
              +mk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))
              +mk(b'IDAT',zlib.compress(raw))
              +mk(b'IEND',b''))
          open('svision3demo.png','wb').write(data)
          "

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -d SVision3Demo.desktop \
            -i svision3demo.png \
            --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: SVision3Demo-appimage
          path: "*.AppImage"

  package-msi:
    name: Package MSI (Windows)
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download build directory (Release)
        uses: actions/download-artifact@v4
        with:
          name: build-windows-latest-Release
          path: build/Release

      - name: Package MSI
        run: cd build/Release && cpack -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: SVision3Demo-windows
          path: build/Release/*.msi

