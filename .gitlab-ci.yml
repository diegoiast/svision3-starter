.windows-build:
  stage: build
  tags:
    - windows
  before_script:
    - pip install conan
    - conan profile detect
  script:
    - conan install . -s build_type=$BUILD_TYPE --build=missing
    - cmake --preset $CMAKE_PRESET
    - cmake --build build/$BUILD_TYPE
    - ctest --test-dir build/$BUILD_TYPE -C $BUILD_TYPE --output-on-failure

linux-debug:
  extends: .linux-build
  variables:
    BUILD_TYPE: Debug
    CMAKE_PRESET: conan-debug

linux-release:
  extends: .linux-build
  variables:
    BUILD_TYPE: Release
    CMAKE_PRESET: conan-release

windows-debug:
  extends: .windows-build
  variables:
    BUILD_TYPE: Debug
    CMAKE_PRESET: conan-debug

windows-release:
  extends: .windows-build
  variables:
    BUILD_TYPE: Release
    CMAKE_PRESET: conan-release

