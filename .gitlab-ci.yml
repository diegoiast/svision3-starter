stages:
  - build
  - package

.linux-build:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y cmake python3-pip
        libgl-dev libx11-dev libxext-dev
        libwayland-dev libxkbcommon-dev libdbus-1-dev
        libcairo2-dev libfontconfig1-dev pkg-config
    - pip3 install conan
    - conan profile detect
  script:
    - conan install . -s build_type=$BUILD_TYPE --build=missing
    - cmake --preset $CMAKE_PRESET
    - cmake --build build/$BUILD_TYPE
    - ctest --test-dir build/$BUILD_TYPE -C $BUILD_TYPE --output-on-failure

