# --- Packaging jobs ---

package-linux:
  stage: package
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y cmake python3-pip dpkg-dev rpm
        libgl-dev libx11-dev libxext-dev
        libwayland-dev libxkbcommon-dev libdbus-1-dev
        libcairo2-dev libfontconfig1-dev pkg-config
    - pip3 install conan
    - conan profile detect
  script:
    - conan install . -s build_type=Release --build=missing
    - cmake --preset conan-release
    - cmake --build build/Release
    - cd build/Release && cpack -C Release
  artifacts:
    paths:
      - build/Release/*.deb
      - build/Release/*.rpm

package-linux-appimage:
  stage: package
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y cmake python3-pip wget libfuse2
        libgl-dev libx11-dev libxext-dev
        libwayland-dev libxkbcommon-dev libdbus-1-dev
        libcairo2-dev libfontconfig1-dev pkg-config
    - pip3 install conan
    - conan profile detect
  script:
    - conan install . -s build_type=Release --build=missing
    - cmake --preset conan-release
    - cmake --build build/Release
    - cmake --install build/Release --prefix AppDir/usr
    - wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
    - chmod +x linuxdeploy-x86_64.AppImage
    - |
      cat > SVision3Demo.desktop <<'EOF'
      [Desktop Entry]
      Name=SVision3Demo
      Exec=demo
      Icon=svision3demo
      Type=Application
      Categories=Utility;
      EOF
    - |
      python3 -c "
      import struct, zlib
      w,h=64,64
      raw=b''.join(b'\x00'+bytes([0,120,212]*w) for _ in range(h))
      def mk(t,d):
          c=struct.pack('>I',len(d))+t+d
          return c+struct.pack('>I',zlib.crc32(c[4:])&0xffffffff)
      data=(b'\x89PNG\r\n\x1a\n'
          +mk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))
          +mk(b'IDAT',zlib.compress(raw))
          +mk(b'IEND',b''))
      open('svision3demo.png','wb').write(data)
      "
    - >
      ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run
      --appdir AppDir
      -d SVision3Demo.desktop
      -i svision3demo.png
      --output appimage
  artifacts:
    paths:
      - "*.AppImage"

package-msi:
  stage: package
  tags:
    - windows
  before_script:
    - pip install conan
    - conan profile detect
  script:
    - conan install . -s build_type=Release --build=missing
    - cmake --preset conan-release
    - cmake --build build/Release --config Release
    - cd build/Release && cpack -C Release
  artifacts:
    paths:
      - build/Release/*.msi

